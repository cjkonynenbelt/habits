<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habits</title>
  <meta name="description" content="A private daily habit tracker. Your data stays on your device.">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('habits.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav id="nav" aria-label="Main"></nav>
  <main id="view"></main>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Habits needs JavaScript to run.</p></noscript>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
